<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C6B4E"/>
      <stop offset="100%" stop-color="#1E4E39"/>
    </linearGradient>
  </defs>

  <!-- background squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- notebook body -->
  <rect x="292" y="256" width="440" height="568" rx="36" fill="#F8F7F2"/>
  <!-- notebook spine -->
  <rect x="292" y="256" width="64" height="568" rx="36" fill="#E6E9E1"/>
  <rect x="292" y="256" width="34" height="568" fill="#F8F7F2"/>
  <!-- spiral binding dots -->
  <circle cx="309" cy="320" r="9" fill="#B9C2B4"/>
  <circle cx="309" cy="400" r="9" fill="#B9C2B4"/>
  <circle cx="309" cy="480" r="9" fill="#B9C2B4"/>
  <circle cx="309" cy="560" r="9" fill="#B9C2B4"/>
  <circle cx="309" cy="640" r="9" fill="#B9C2B4"/>
  <circle cx="309" cy="720" r="9" fill="#B9C2B4"/>
  <circle cx="309" cy="800" r="9" fill="#B9C2B4"/>

  <!-- ruled lines representing order entries -->
  <rect x="400" y="420" width="270" height="14" rx="7" fill="#245C43" opacity="0.30"/>
  <rect x="400" y="486" width="270" height="14" rx="7" fill="#245C43" opacity="0.30"/>
  <rect x="400" y="552" width="190" height="14" rx="7" fill="#245C43" opacity="0.30"/>

  <!-- completed order check -->
  <circle cx="662" cy="622" r="44" fill="#245C43"/>
  <path d="M 640 622 L 655 638 L 686 604" stroke="#F8F7F2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- leaf bookmark ribbon -->
  <path d="M 620 256 L 700 256 L 700 400 L 660 360 L 620 400 Z" fill="#D9A441"/>
</svg>
